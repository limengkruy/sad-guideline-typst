      C 148 401 160 389 175 389
      L 277 389
      L 293 331
      L 118 331
      C 103 331 91 319 91 304
      C 91 289 103 277 118 277
      L 308 277
      L 324 220
      L 168 220
      C 153 220 141 208 141 193
      C 141 178 153 166 168 166
      L 348 166
      C 358 166 367 172 371 182
      Z" />

